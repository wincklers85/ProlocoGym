<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amministrazione Bar</title><link rel="stylesheet" href="/style.css"></head><body data-theme="clean-light"><div id="login" class="login"><div class="card"><div class="hero"><div class="logo" style="margin:auto">BAR</div><h1>Amministrazione rinnovi</h1><p class="notice">Accesso per Bar Il Gallo Nero / Ristorante: rinnovi, entrata singola e ricerca tessere.</p></div><div class="form"><label>Username</label><input id="u" value="gallonero"><label>Password</label><input id="p" type="password" value="gallo123"><button class="primary" onclick="login()">Entra</button><p id="msg"></p></div></div></div><div id="app" class="main" style="display:none"><div class="top"><h2>Rinnovi palestra</h2><span id="who" class="pill"></span></div><div class="card"><h3>Cerca tessera</h3><div class="row"><input id="q" class="bigInput" placeholder="Codice tessera GYM-001"><button class="primary" onclick="search()">Cerca</button></div><p id="searchMsg"></p></div><div id="profile" class="card" style="display:none;margin-top:14px"><h3 id="name"></h3><p>Codice: <b id="member"></b> | Tessera: <b id="card"></b></p><p>Scadenza: <b id="expiry"></b> | Stato: <b id="status"></b></p><div class="actions" id="priceBtns"></div><hr style="border-color:#24384d"><h3>Rinnovo manuale</h3><div class="row"><input id="amount" type="number" step="0.01" placeholder="Importo ricevuto"><input id="note" placeholder="Nota opzionale"></div><br><button class="secondary" onclick="oneShot()">Concedi entrata singola</button><p id="renewMsg"></p></div></div><script src="/bar/bar.js"></script><script src="/theme.js"></script></body></html>
